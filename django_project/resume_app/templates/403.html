{% extends "resume_app/base.html" %}

{% block title %}Access Denied (403) — HireEdge{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl py-12 text-center">
    <div class="inline-flex h-20 w-20 items-center justify-center rounded-3xl bg-amber-50 text-amber-700 mb-6 shadow-sm">
        <svg class="h-10 w-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
    </div>

    <h1 class="text-4xl font-extrabold tracking-tight text-concierge-slate sm:text-5xl">403</h1>
    <p class="mt-2 text-xl font-bold text-concierge-slate sm:text-2xl">Access denied</p>
    <p class="mx-auto mt-4 max-w-md text-sm text-slate-600">
        You do not have permission to view this resource. If you believe this is an error, please contact your administrator.
    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <a href="{% if user.is_authenticated %}{% url 'pipeline' %}{% else %}{% url 'landing' %}{% endif %}"
           class="inline-flex items-center gap-2 rounded-concierge bg-brand px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-hover">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
