{% extends "resume_app/auth/base_public.html" %}
{% block title %}Check your email — HireEdge{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card">
        <h1 class="text-2xl font-bold tracking-tight text-concierge-slate">Check your email</h1>
        <p class="mt-2 text-sm text-slate-600">
            If an account exists for that address, we sent password reset instructions.
        </p>
        <p class="mt-6 text-sm">
            <a href="{% url 'login' %}" class="font-semibold text-brand hover:text-brand-hover">Back to sign in</a>
        </p>
    </div>
</div>
{% endblock %}
