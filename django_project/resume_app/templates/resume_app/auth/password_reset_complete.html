{% extends "resume_app/auth/base_public.html" %}
{% block title %}Password updated — ResumeElite{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card">
        <h1 class="text-2xl font-bold tracking-tight text-concierge-slate">Password updated</h1>
        <p class="mt-2 text-sm text-slate-600">Your password has been changed. You can sign in with the new password.</p>
        <p class="mt-6">
            <a href="{% url 'login' %}" class="inline-flex rounded-concierge bg-brand px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-hover">
                Sign in
            </a>
        </p>
    </div>
</div>
{% endblock %}
