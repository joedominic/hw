{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <title>{% block title %}ResumeElite{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include "resume_app/_tailwind_theme.html" %}
    {% block extra_head %}{% endblock %}
</head>
<body class="brand-public min-h-full bg-concierge-soft font-sans text-concierge-slate antialiased">
    <header class="border-b border-slate-200/80 bg-white">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
            <a href="{% url 'landing' %}" class="text-xl font-bold tracking-tight text-brand">ResumeElite</a>
            <nav class="flex items-center gap-2 sm:gap-3">
                {% block header_nav %}
                <a href="{% url 'login' %}" class="rounded-concierge px-3 py-1.5 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-concierge-slate">
                    Sign in
                </a>
                {% if signup_enabled %}
                <a href="{% url 'signup' %}" class="rounded-concierge bg-brand px-3.5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-hover">
                    Get started
                </a>
                {% endif %}
                {% endblock %}
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-12 sm:px-6 sm:py-16">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
