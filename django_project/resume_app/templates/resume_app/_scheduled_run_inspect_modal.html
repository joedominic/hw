{# Reusable Scheduled Job Search Run Inspector Modal #}
<dialog id="scheduledRunInspectDialog" class="concierge-dialog w-[min(100vw-2rem,64rem)] max-h-[90vh] overflow-hidden p-0 rounded-2xl border border-slate-200 shadow-2xl backdrop:bg-slate-900/40" aria-labelledby="scheduledRunInspectTitle">
    <div class="flex max-h-[90vh] flex-col bg-white">
        <header class="flex shrink-0 items-center justify-between border-b border-slate-200 bg-white px-5 py-3.5">
            <div>
                <h2 id="scheduledRunInspectTitle" class="m-0 text-base font-semibold text-concierge-slate">
                    Run Breakdown: <span id="inspectProfileName" class="text-brand"></span>
                </h2>
                <p id="inspectRunMeta" class="mt-0.5 mb-0 text-xs text-slate-500"></p>
            </div>
            <div class="flex items-center gap-2">
                <a id="inspectDownloadCsvBtn" href="#" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-brand shadow-sm hover:bg-slate-50 transition">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download CSV
                </a>
                <button type="button" id="scheduledRunInspectClose" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition" aria-label="Close">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Summary & Filters Toolbar -->
        <div class="border-b border-slate-200 bg-slate-50/60 px-5 py-3 space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <!-- Filter Tabs -->
                <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 text-xs font-medium text-slate-600 shadow-sm" id="inspectFilterTabs">
                    <button type="button" class="inspect-filter-tab rounded-md px-2.5 py-1 text-white bg-slate-800 transition" data-filter="all">
                        All (<span id="inspectCountAll">0</span>)
                    </button>
                    <button type="button" class="inspect-filter-tab rounded-md px-2.5 py-1 text-slate-600 hover:text-slate-900 transition" data-filter="saved">
                        Saved to Pipeline (<span id="inspectCountSaved">0</span>)
                    </button>
                    <button type="button" class="inspect-filter-tab rounded-md px-2.5 py-1 text-slate-600 hover:text-slate-900 transition" data-filter="eliminated">
                        Eliminated (<span id="inspectCountEliminated">0</span>)
                    </button>
                    <button type="button" class="inspect-filter-tab rounded-md px-2.5 py-1 text-slate-600 hover:text-slate-900 transition" data-filter="skipped">
                        In Pipeline / Prev (<span id="inspectCountSkipped">0</span>)
                    </button>
                </div>

                <!-- Search Input -->
                <div class="relative min-w-[200px] flex-1 sm:max-w-xs">
                    <input type="text" id="inspectSearchInput" placeholder="Filter by title, company, reason..."
                           class="w-full rounded-md border border-slate-200 bg-white py-1.5 pl-8 pr-3 text-xs placeholder-slate-400 focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
                    <svg class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Table Body Container -->
        <div class="min-h-0 flex-1 overflow-y-auto px-5 py-3">
            <div id="inspectLoading" class="py-12 text-center text-sm text-slate-500">
                <svg class="animate-spin inline-block w-5 h-5 mr-2 text-slate-400" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Loading audit details...
            </div>
            <div id="inspectError" class="hidden py-8 text-center text-sm text-red-600"></div>

            <table id="inspectTable" class="hidden w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="border-b border-slate-200 bg-slate-50/50 text-[11px] font-semibold uppercase tracking-wider text-slate-500 sticky top-0">
                        <th class="py-2.5 px-3">Job Title &amp; Company</th>
                        <th class="py-2.5 px-3">Location / Source</th>
                        <th class="py-2.5 px-3">Status</th>
                        <th class="py-2.5 px-3">Elimination Reason / Details</th>
                    </tr>
                </thead>
                <tbody id="inspectTableBody" class="divide-y divide-slate-100">
                </tbody>
            </table>
            <div id="inspectNoResults" class="hidden py-8 text-center text-xs text-slate-400">
                No jobs match the current filter criteria.
            </div>
        </div>

        <footer class="flex shrink-0 items-center justify-between border-t border-slate-100 bg-slate-50/40 px-5 py-2.5 text-xs text-slate-500">
            <span>Detailed breakdown kept for recent runs.</span>
            <button type="button" id="scheduledRunInspectFooterClose" class="rounded-lg border border-slate-200 bg-white px-3 py-1 font-medium text-slate-600 hover:bg-slate-50">Done</button>
        </footer>
    </div>
</dialog>

<script>
(function() {
    var inspectDialog = document.getElementById("scheduledRunInspectDialog");
    var inspectProfileName = document.getElementById("inspectProfileName");
    var inspectRunMeta = document.getElementById("inspectRunMeta");
    var inspectDownloadCsvBtn = document.getElementById("inspectDownloadCsvBtn");
    var inspectCloseBtn = document.getElementById("scheduledRunInspectClose");
    var inspectFooterCloseBtn = document.getElementById("scheduledRunInspectFooterClose");
    var inspectLoading = document.getElementById("inspectLoading");
    var inspectError = document.getElementById("inspectError");
    var inspectTable = document.getElementById("inspectTable");
    var inspectTableBody = document.getElementById("inspectTableBody");
    var inspectNoResults = document.getElementById("inspectNoResults");
    var inspectSearchInput = document.getElementById("inspectSearchInput");
    var inspectFilterTabs = document.querySelectorAll(".inspect-filter-tab");
    var currentAuditItems = [];
    var currentRunTrack = "";
    var activeFilter = "all";


    function closeInspectDialog() {
        if (inspectDialog && inspectDialog.close) inspectDialog.close();
    }
    if (inspectCloseBtn) inspectCloseBtn.addEventListener("click", closeInspectDialog);
    if (inspectFooterCloseBtn) inspectFooterCloseBtn.addEventListener("click", closeInspectDialog);
    if (inspectDialog) {
        inspectDialog.addEventListener("click", function(e) {
            if (e.target === inspectDialog) closeInspectDialog();
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderAuditRows() {
        if (!inspectTableBody) return;
        var q = (inspectSearchInput ? inspectSearchInput.value : "").trim().toLowerCase();
        var visibleCount = 0;
        var html = "";

        currentAuditItems.forEach(function(item) {
            var disp = item.disposition || "";
            var isSaved = disp === "saved_to_pipeline" || disp === "reposted_to_pipeline";
            var isSkipped = disp === "already_in_pipeline" || disp === "previously_removed" || disp === "expired_not_reposted";
            var isEliminated = disp.indexOf("eliminated") === 0;

            if (activeFilter === "saved" && !isSaved) return;
            if (activeFilter === "eliminated" && !isEliminated) return;
            if (activeFilter === "skipped" && !isSkipped) return;

            var title = item.title || "";
            var company = item.company || "";
            var location = item.location || "";
            var reason = item.reason || "";
            var source = item.source || "";

            if (q) {
                var searchTarget = (title + " " + company + " " + location + " " + reason + " " + source).toLowerCase();
                if (searchTarget.indexOf(q) === -1) return;
            }

            visibleCount++;

            var badgeHtml = "";
            if (isSaved) {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-green-50 px-2 py-0.5 font-medium text-green-700 border border-green-200/50"><span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>Saved</span>';
            } else if (disp === "already_in_pipeline") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-blue-50 px-2 py-0.5 font-medium text-blue-700 border border-blue-200/50"><span class="h-1.5 w-1.5 rounded-full bg-blue-500"></span>In Pipeline</span>';
            } else if (disp === "previously_removed" || disp === "expired_not_reposted") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-slate-100 px-2 py-0.5 font-medium text-slate-600 border border-slate-200/50"><span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>Skipped</span>';
            } else if (disp === "eliminated_disqualifier") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-amber-50 px-2 py-0.5 font-medium text-amber-700 border border-amber-200/50"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>Disqualifier</span>';
            } else if (disp === "eliminated_disliked") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-rose-50 px-2 py-0.5 font-medium text-rose-700 border border-rose-200/50"><span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span>Disliked</span>';
            } else if (disp === "eliminated_hidden") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-slate-100 px-2 py-0.5 font-medium text-slate-700 border border-slate-200/50"><span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>Hidden</span>';
            } else if (disp === "eliminated_duplicate") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-purple-50 px-2 py-0.5 font-medium text-purple-700 border border-purple-200/50"><span class="h-1.5 w-1.5 rounded-full bg-purple-500"></span>Duplicate</span>';
            } else if (disp === "eliminated_low_preference") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-orange-50 px-2 py-0.5 font-medium text-orange-700 border border-orange-200/50"><span class="h-1.5 w-1.5 rounded-full bg-orange-500"></span>Low Fit</span>';
            } else if (disp === "eliminated_disliked_similarity") {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-rose-50 px-2 py-0.5 font-medium text-rose-700 border border-rose-200/50"><span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span>Disliked Trait</span>';
            } else {
                badgeHtml = '<span class="inline-flex items-center gap-1 rounded bg-slate-100 px-2 py-0.5 font-medium text-slate-600 border border-slate-200/50"><span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>Eliminated</span>';
            }

            var linkHtml = item.url
                ? '<a href="' + encodeURI(item.url) + '" target="_blank" rel="noopener noreferrer" class="font-medium text-slate-900 hover:text-brand hover:underline inline-flex items-center gap-1">' +
                  escapeHtml(title) +
                  '<svg class="w-3 h-3 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg></a>'
                : '<span class="font-medium text-slate-900">' + escapeHtml(title) + '</span>';

            var fitInspectBtn = "";
            if (item.job_id) {
                var fitUrl = "/system/fit-inspector/?job_id=" + encodeURIComponent(item.job_id);
                if (currentRunTrack) {
                    fitUrl += "&track=" + encodeURIComponent(currentRunTrack);
                }
                fitInspectBtn = '<div class="mt-1">' +
                    '<a href="' + fitUrl + '" target="_blank" rel="noopener noreferrer" ' +
                    'class="inline-flex items-center gap-1 font-semibold text-brand hover:text-brand-ink hover:underline text-[11px]" ' +
                    'title="Inspect why this job was scored or eliminated against this search profile in Fit Inspector">' +
                    '<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>' +
                    'Inspect Fit ↗</a>' +
                    '</div>';
            }

            html += '<tr class="hover:bg-slate-50/70 transition">' +
                '<td class="py-2.5 px-3 max-w-[280px] truncate">' +
                    linkHtml +
                    '<div class="text-[11px] text-slate-500">' + escapeHtml(company) + '</div>' +
                '</td>' +
                '<td class="py-2.5 px-3 max-w-[180px] truncate text-slate-600">' +
                    '<div>' + escapeHtml(location || "—") + '</div>' +
                    '<div class="text-[10px] text-slate-400 uppercase tracking-wider">' + escapeHtml(source || "") + '</div>' +
                '</td>' +
                '<td class="py-2.5 px-3 whitespace-nowrap">' + badgeHtml + '</td>' +
                '<td class="py-2.5 px-3 text-slate-600 max-w-[320px] text-[11px]">' +
                    '<div>' + escapeHtml(reason || "—") + '</div>' +
                    fitInspectBtn +
                '</td>' +
            '</tr>';

        });

        inspectTableBody.innerHTML = html;
        if (visibleCount === 0) {
            inspectTable.classList.add("hidden");
            inspectNoResults.classList.remove("hidden");
        } else {
            inspectTable.classList.remove("hidden");
            inspectNoResults.classList.add("hidden");
        }
    }

    function updateFilterCounts() {
        var all = currentAuditItems.length;
        var saved = 0;
        var eliminated = 0;
        var skipped = 0;
        currentAuditItems.forEach(function(item) {
            var disp = item.disposition || "";
            if (disp === "saved_to_pipeline" || disp === "reposted_to_pipeline") saved++;
            else if (disp === "already_in_pipeline" || disp === "previously_removed" || disp === "expired_not_reposted") skipped++;
            else if (disp.indexOf("eliminated") === 0) eliminated++;
        });
        var countAllEl = document.getElementById("inspectCountAll");
        var countSavedEl = document.getElementById("inspectCountSaved");
        var countEliminatedEl = document.getElementById("inspectCountEliminated");
        var countSkippedEl = document.getElementById("inspectCountSkipped");
        if (countAllEl) countAllEl.textContent = all;
        if (countSavedEl) countSavedEl.textContent = saved;
        if (countEliminatedEl) countEliminatedEl.textContent = eliminated;
        if (countSkippedEl) countSkippedEl.textContent = skipped;
    }

    if (inspectSearchInput) {
        inspectSearchInput.addEventListener("input", renderAuditRows);
    }

    inspectFilterTabs.forEach(function(tab) {
        tab.addEventListener("click", function() {
            inspectFilterTabs.forEach(function(t) {
                t.classList.remove("text-white", "bg-slate-800");
                t.classList.add("text-slate-600");
            });
            tab.classList.add("text-white", "bg-slate-800");
            tab.classList.remove("text-slate-600");
            activeFilter = tab.getAttribute("data-filter") || "all";
            renderAuditRows();
        });
    });

    document.addEventListener("click", function(e) {
        var btn = e.target.closest(".inspect-run-btn");
        if (!btn) return;
        e.preventDefault();

        var runId = btn.getAttribute("data-run-id");
        var profile = btn.getAttribute("data-profile") || "Search";
        var track = btn.getAttribute("data-track") || "";
        var date = btn.getAttribute("data-date") || "";
        var jsonUrl = btn.getAttribute("data-json-url");
        var csvUrl = btn.getAttribute("data-csv-url");
        var fetched = btn.getAttribute("data-fetched") || "0";
        var eliminated = btn.getAttribute("data-eliminated") || "0";
        var saved = btn.getAttribute("data-saved") || "0";

        currentRunTrack = track;
        if (inspectProfileName) inspectProfileName.textContent = profile;
        if (inspectRunMeta) inspectRunMeta.textContent = (date ? date + " · " : "") + fetched + " fetched · " + eliminated + " eliminated · " + saved + " saved";
        if (inspectDownloadCsvBtn) {
            if (csvUrl) {
                inspectDownloadCsvBtn.setAttribute("href", csvUrl);
                inspectDownloadCsvBtn.classList.remove("hidden");
            } else {
                inspectDownloadCsvBtn.classList.add("hidden");
            }
        }

        currentAuditItems = [];
        activeFilter = "all";
        if (inspectSearchInput) inspectSearchInput.value = "";
        inspectFilterTabs.forEach(function(t, idx) {
            if (idx === 0) {
                t.classList.add("text-white", "bg-slate-800");
                t.classList.remove("text-slate-600");
            } else {
                t.classList.remove("text-white", "bg-slate-800");
                t.classList.add("text-slate-600");
            }
        });

        if (inspectLoading) inspectLoading.classList.remove("hidden");
        if (inspectError) inspectError.classList.add("hidden");
        if (inspectTable) inspectTable.classList.add("hidden");
        if (inspectNoResults) inspectNoResults.classList.add("hidden");

        if (inspectDialog && inspectDialog.showModal) inspectDialog.showModal();

        if (!jsonUrl) {
            if (inspectLoading) inspectLoading.classList.add("hidden");
            if (inspectError) {
                inspectError.textContent = "No detailed audit log available for this run.";
                inspectError.classList.remove("hidden");
            }
            return;
        }

        fetch(jsonUrl)
            .then(function(res) {
                if (!res.ok) throw new Error("Could not load run details (" + res.status + ")");
                return res.json();
            })
            .then(function(data) {
                if (inspectLoading) inspectLoading.classList.add("hidden");
                currentAuditItems = data.details || [];
                currentRunTrack = data.track || currentRunTrack || "";
                updateFilterCounts();
                renderAuditRows();
            })

            .catch(function(err) {
                if (inspectLoading) inspectLoading.classList.add("hidden");
                if (inspectError) {
                    inspectError.textContent = err.message || "Failed to load run details.";
                    inspectError.classList.remove("hidden");
                }
            });
    });
})();
</script>
