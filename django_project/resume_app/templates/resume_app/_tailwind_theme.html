{# Shared CareerFlow-inspired theme for all public + app shells. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: {
                        DEFAULT: "#065f46",
                        hover: "#047857",
                        soft: "#dcfce7",
                        mist: "#ecfdf5",
                        ink: "#064e3b",
                    },
                    concierge: {
                        slate: "#1e293b",
                        canvas: "#ffffff",
                        soft: "#f8fafc",
                        muted: "#64748b",
                        dark: "#0f172a",
                    },
                },
                borderRadius: { concierge: "0.5rem" },
                fontFamily: {
                    sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"],
                },
                boxShadow: {
                    card: "0 1px 2px rgb(15 23 42 / 0.04), 0 4px 16px rgb(15 23 42 / 0.04)",
                },
            },
        },
    };
</script>
<style>
    :root {
        --brand: #065f46;
        --brand-hover: #047857;
        --brand-soft: #dcfce7;
        --ink: #1e293b;
        --muted: #64748b;
    }
    body.concierge-app,
    body.brand-public {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    dialog.concierge-dialog {
        margin: auto;
        max-width: calc(100vw - 2rem);
        border: none;
        padding: 0;
        background: transparent;
    }
    dialog.concierge-dialog::backdrop {
        background: rgb(15 23 42 / 0.45);
    }
    @keyframes brand-fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .brand-animate {
        animation: brand-fade-up 0.55s ease-out both;
    }
    .brand-animate-delay-1 { animation-delay: 0.08s; }
    .brand-animate-delay-2 { animation-delay: 0.16s; }
    .brand-animate-delay-3 { animation-delay: 0.24s; }
</style>
