# Dev profile: Django runserver + Huey worker.
# Database: external MySQL/MariaDB via MYSQL_* in .env (recommended).
# Redis broker: external via HUEY_REDIS_* / REDIS_PASSWORD in .env.
# Usage (from repo root): docker compose up --build
services:
  web:
    build: .
    image: jobapp-jules-app:latest
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent uploads + model cache. No SQLite mount: the app uses external MySQL.
      # For a SQLite-only demo, add: - ./django_project/db.sqlite3:/app/django_project/db.sqlite3
      - ./django_project/media:/app/django_project/media
      - hf_cache:/root/.cache/huggingface

  huey:
    image: jobapp-jules-app:latest
    build: .
    command: python manage.py run_huey
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./django_project/media:/app/django_project/media
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - web

volumes:
  hf_cache:
