# Dedicated Redis for JobApp-Main (Huey queue + LLM limits + Django cache).
# Leave the primary Redis (6379) for optiondataID / other apps.
#
# Install as a second systemd instance on the Pi, OR run via Docker:
#   docker run -d --name redis-jobapp --restart unless-stopped \
#     -p 6380:6379 -v redis-jobapp-data:/data \
#     redis:7.0-alpine redis-server /usr/local/etc/redis/redis.conf
#   (mount this file at /usr/local/etc/redis/redis.conf)

port 6380
bind 0.0.0.0
protected-mode yes
# Set a password in production: requirepass <strong-password>
# Then set REDIS_PASSWORD in JobApp-Main .env

daemonize no
supervised systemd
pidfile /run/redis/redis-jobapp.pid
logfile /var/log/redis/redis-jobapp.log
dir /var/lib/redis-jobapp

# Persistence (AOF preferred for queue durability)
appendonly yes
appendfsync everysec
save 900 1
save 300 10

# Bound memory so a runaway result store cannot OOM the Pi.
# noeviction: never drop Huey queue payloads (losing tasks silently is worse).
maxmemory 512mb
maxmemory-policy noeviction

# Slightly quieter defaults
tcp-backlog 511
timeout 0
tcp-keepalive 300
