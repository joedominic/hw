# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  migrate:
    image: jobapp-jules-app:latest
    command: python manage.py migrate --noinput
    restart: "no"
    environment:
      APP_ENV: production
      DEBUG: "False"
      RUN_MIGRATIONS: "0"
    env_file:
      - path: .env
        required: false

  web:
    command: >
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 120
      --graceful-timeout 30
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DEBUG: "False"
      RUN_MIGRATIONS: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  huey:
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10m
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DEBUG: "False"
      RUN_MIGRATIONS: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; r=redis.Redis(host=os.environ.get('HUEY_REDIS_HOST','127.0.0.1'), port=int(os.environ.get('HUEY_REDIS_PORT',6379)), db=int(os.environ.get('HUEY_REDIS_DB',0)), password=(os.environ.get('REDIS_PASSWORD') or None)); r.ping()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
